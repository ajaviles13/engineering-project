version: "1.0"

metadata:
  name: "Scalable Bookkeeping Categorization Rules"
  description: "Default categorization taxonomy and matching rules"
  last_updated: "2026-06-18"

settings:
  default_category: "Uncategorized:Review Needed"
  case_sensitive: false
  normalize_whitespace: true
  strip_special_characters: true

categories:

  Income:

    Sales Revenue:
      accounting_account: "Sales Revenue"
      tax_treatment: "income"

      rules:
        - type: keyword
          value: "invoice payment"
        - type: keyword
          value: "customer payment"
        - type: keyword
          value: "subscription revenue"

      merchants:
        - Stripe
        - Square
        - Shopify
        - PayPal

    Interest Income:
      accounting_account: "Interest Income"
      tax_treatment: "income"

      rules:
        - type: keyword
          value: "interest earned"
        - type: keyword
          value: "interest payment"

  Cost of Goods Sold:

    Inventory Purchases:
      accounting_account: "Inventory Purchases"

      rules:
